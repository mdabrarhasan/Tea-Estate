<video autoplay muted id="myVideo">
  <source src="../../../../assets/video/login-video.mp4" type="video/mp4" />
</video>

<div class="auth-page-wrapper pt-3">
  <!-- auth page bg -->

  <!-- auth page content -->
  <div class="auth-page-content">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center mt-sm-5 mb-4 text-white-50">
            <div>
              <a routerLink="/" class="d-inline-block auth-logo">
                <!-- <img src="assets/images/logo-light.png" alt="" height="20"> -->
              </a>
            </div>
          </div>
        </div>
      </div>
      <!-- end row -->

      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
          <div class="card mt-4">
            <div class="card-body p-4">
              <div class="text-center mt-2">
                <h5 style="color: #0ab39c">Welcome Back !</h5>
                <p class="text-muted">Sign in to continue to AkijBashir.</p>
              </div>
              <div class="p-2 mt-4">
                <form [formGroup]="loginform" (ngSubmit)="onSubmit()">
                  <div class="mb-3">
                    <label class="form-label" for="username">User Name</label>
                    <input
                      class="form-control"
                      id="email"
                      formControlName="UserID"
                      [ngClass]="{
                        'is-invalid': submitted && f['UserID'].errors
                      }"
                      placeholder="Enter User Name"
                    />
                    <!-- <input formControlName="UserID" placeholder="Enter Your Email" [ngClass]="{ 'is-invalid': submitted && f['UserID'].errors }"> -->
                    <div
                      *ngIf="submitted && f['UserID'].errors"
                      class="invalid-feedback"
                    >
                      <div *ngIf="f['UserID'].errors['required']">
                        User Mail is Required
                      </div>
                    </div>
                  </div>

                  <div class="mb-3">
                    <div class="float-end">
                      <a routerLink="/pass-reset/basic" style="color: #0ab39c"
                        >Forgot password?</a
                      >
                    </div>
                    <label class="form-label" for="password-input"
                      >Password</label
                    >
                    <div class="position-relative auth-pass-inputgroup mb-3">
                      <input
                        [type]="fieldTextType ? 'text' : 'password'"
                        class="form-control pe-5"
                        placeholder="Enter password"
                        id="password-input"
                        formControlName="Emppass"
                        [ngClass]="{
                          'is-invalid': submitted && f['Emppass'].errors
                        }"
                      />
                      <!-- <input type="password" formControlName="Emppass" matInput placeholder="Enter Your Password" class="example-full-width" [ngClass]="{ 'is-invalid': submitted && f['Emppass'].errors }"> -->
                      <div
                        *ngIf="submitted && f['Emppass'].errors"
                        class="invalid-feedback"
                      >
                        <div *ngIf="f['Emppass'].errors['required']">
                          Password is Required
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="auth-remember-check"
                    />
                    <label
                      class="form-check-label"
                      for="auth-remember-check"
                      style="color: #0ab39c"
                      >Remember me</label
                    >
                  </div>

                  <div class="mt-4">
                    <button class="btn btn-success w-100" type="submit">
                      Sign In
                    </button>
                  </div>

                  <div class="mt-4 text-center">
                    <div class="signin-other-title">
                      <h5 class="fs-13 mb-4 title" style="color: #0ab39c">
                        Sign In with
                      </h5>
                    </div>
                    <div class="d-flex gap-2 justify-content-center">
                      <button
                        type="button"
                        class="btn btn-primary btn-icon waves-effect waves-light"
                      >
                        <i class="ri-facebook-fill fs-16"></i>
                      </button>
                      <button
                        type="button"
                        class="btn btn-danger btn-icon waves-effect waves-light"
                      >
                        <i class="ri-google-fill fs-16"></i>
                      </button>
                      <button
                        type="button"
                        class="btn btn-dark btn-icon waves-effect waves-light"
                      >
                        <i class="ri-github-fill fs-16"></i>
                      </button>
                      <button
                        type="button"
                        class="btn btn-info btn-icon waves-effect waves-light"
                      >
                        <i class="ri-twitter-fill fs-16"></i>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
            <!-- end card body -->
          </div>
          <!-- end card -->

          <!-- <div class="mt-4 text-center">
                        <p class="mb-0">Don't have an account ? <a routerLink="/auth/register" class="fw-semibold text-primary text-decoration-underline"> Signup </a> </p>
                    </div> -->
        </div>
      </div>
      <!-- end row -->
    </div>
    <!-- end container -->
  </div>
  <!-- end auth page content -->

  <!-- footer -->
  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center">
            <p class="mb-0 text-muted">&copy; {{ year }} AkijBashir.</p>
          </div>
        </div>
      </div>
    </div>
  </footer>
  <!-- end Footer -->
</div>
<!-- end auth-page-wrapper -->
