<form [formGroup]="MasterForm">
<div class="profile-foreground position-relative mx-n4 mt-n4">
  <div>
      <img src="../../../assets/images/background.jpg" alt="" height="500" width="100%" />
  </div>
</div>
<div class="row" style="margin-top: -100px;">
  <div class="col-xxl-9">
    <div class="card mt-xxl-n5">
        <div class="card-header">
            <ul ngbNav #customNav="ngbNav" [activeId]="1" class="nav nav-tabs-custom rounded card-header-tabs border-bottom-0" role="tablist">
                <li [ngbNavItem]="1" class="nav-item">
                    <a ngbNavLink class="nav-link" data-bs-toggle="tab" role="tab">
                        <i class="fas fa-home"></i> Company Info
                    </a>
                    <ng-template ngbNavContent>
                       
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label class="form-label">Company Name</label>
                                        <input type="text" class="form-control" formControlName="unitname" placeholder="Enter your firstname" value="{{unitname}}">
                                    </div>
                                </div><!--end col-->
                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label for="lastnameInput" class="form-label">Address</label>
                                        <input type="text" class="form-control" formControlName="address" placeholder="Enter your lastname" value="{{address}}">
                                    </div>
                                </div><!--end col-->
                                <div class="col-lg-6">
                                  <div class="mb-3">
                                      <label for="phonenumberInput" class="form-label">Email ID</label>
                                      <input type="text" class="form-control" formControlName="email" placeholder="Enter your phone number" value="{{email}}">
                                  </div>
                              </div><!--end col-->
                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label for="phonenumberInput" class="form-label">Contact Number</label>
                                        <input type="text" class="form-control" formControlName="contactnumber" placeholder="Enter your phone number" value="{{contactnumber}}">
                                    </div>
                                </div><!--end col-->
                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label for="emailInput" class="form-label">Reply To Email ID</label>
                                        <input type="email" class="form-control" formControlName="replytoemail" placeholder="Enter your email" value="{{replytoemail}}">
                                    </div>
                                </div><!--end col-->
                                <div class="col-lg-6">
                                    <div class="mb-3">
                                        <label for="JoiningdatInput" class="form-label">Contact Person</label>
                                        <input class="form-control" type="text" formControlName="contactperson" value="{{contactperson}}">
                                    </div>
                                </div><!--end col-->
                                <div class="col-lg-12">
                                    <div class="mb-3">
                                        <label for="skillsInput" class="form-label">Round OF Rule</label>
                                        <select class="form-control" formControlName="roundoffruleid">
                                          <option [value]="">--Select--</option>
                                          <option *ngFor="let x of roundoffrulelist" [value]="x.id">
                                              {{x.name}}
                                          </option>
                                      </select>
                                    </div>
                                </div><!--end col-->
                                <div class="col-lg-4">
                                        <label for="designationInput" class="form-label">Unit For Area Plucked</label>
                                        <select class="form-control" formControlName="unitareapluckedid">
                                          <option [value]="">--Select--</option>
                                          <option *ngFor="let x of pluckedlist" [value]="x.id">
                                              {{x.name}}
                                          </option>
                                      </select>
                                </div><!--end col-->
                                <div class="col-lg-4">
                                      <label for="designationInput" class="form-label">Unit For Leaf Per Area</label>
                                      <select class="form-control" formControlName="unitforleafareaid">
                                        <option [value]="">--Select--</option>
                                        <option *ngFor="let x of pluckedlist" [value]="x.id">
                                            {{x.name}}
                                        </option>
                                    </select>
                                </div><!--end col-->
                                <div class="col-lg-4">
                                        <label for="cityInput" class="form-label">Unit For Plucker Per Area</label>
                                        <select class="form-control" formControlName="unitforpluckerperareaid">
                                          <option [value]="">--Select--</option>
                                          <option *ngFor="let x of facrecoglist" [value]="x.id">
                                              {{x.name}}
                                          </option>
                                      </select>

                                </div><!--end col-->
                                <div class="col-lg-12">
                                      <label for="cityInput" class="form-label">Attendance Face Recognization</label>
                                      <select class="form-control" formControlName="facerecognizationruleid">
                                        <option [value]="0">--Select--</option>
                                        <option *ngFor="let x of roundoffrulelist" [value]="x.id">
                                            {{x.name}}
                                        </option>
                                    </select>
                                    </div>
                       
                            </div><!--end row-->
           
                    </ng-template>
                </li>
           
            </ul>
        </div>
        <div class="card-body p-4">
            <div class="tab-content">
                <div [ngbNavOutlet]="customNav"></div>
            </div>
        </div>
    </div>
</div>
</div><!--end row-->
</form>
