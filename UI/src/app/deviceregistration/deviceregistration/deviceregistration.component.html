<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title mb-0">
          <i class="bx bxs-devices"></i> Device Registration
        </h4>
      </div>
      <!-- end card header -->

      <div class="card-body">
        <div class="row">
          <div class="col-sm-4">
            <button
              type="button"
              class="btn btn-success"
              data-bs-toggle="modal"
              data-bs-target="#staticBackdrop"
              *hasPermission="'insert'"
            >
              <i class="bx bx-plus-circle align-middle fs-16 me-2"></i>Create
              New
            </button>
          </div>
          <div class="col-sm-4"></div>

          <div class="col-sm-4">
            <input
              type="text"
              class="form-control search"
              placeholder="Search..."
              [(ngModel)]="searchText"
              (input)="filterData()"
            />
          </div>
        </div>
        <br />

        <div class="table-responsive">
          <table class="table table-gridjs">
            <thead style="background-color: rgb(243, 243, 249)">
              <tr>
                <th
                  style="width: 30%"
                  class="sort"
                  data-sort="name"
                  (click)="onSort('name')"
                >
                  Name
                </th>
                <th
                  style="width: 30%"
                  class="sort"
                  data-sort="code"
                  (click)="onSort('code')"
                >
                  Code
                </th>
                <th style="width: 10%" class="sort" data-sort="action">
                  Action
                </th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of pageOfItems">
                <td>{{ data.name }}</td>
                <td>{{ data.code }}</td>
                <td>
                  <button
                    type="button"
                    class="btn btn-warning"
                    *hasPermission="'delete'"
                    (click)="Delete(data.code)"
                  >
                    <i class="bx bxs-trash-alt"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="row justify-content-md-between align-items-md-center">
          <pagination
            [items]="items"
            (changePage)="onChangePage($event)"
          ></pagination>
          <!-- End Pagination -->
        </div>
      </div>
      <!-- end card-body -->
    </div>
    <!-- end card -->
  </div>
  <!-- end col -->
</div>
<!-- end row -->

<!-- CREATE MODAL -->
<form [formGroup]="MasterForm">
  <div
    class="modal fade"
    id="staticBackdrop"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
    role="dialog"
    aria-labelledby="staticBackdropLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalgridLabel">
            <i class="bx bx-plus-medical"></i> Create Device
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="device-code" class="col-form-label">Device Code:</label>
            <input
              type="text"
              class="form-control"
              id="device-code"
              formControlName="Code"
              placeholder="Enter device code"
            />
          </div>
          <div class="mb-3">
            <label for="device-name" class="col-form-label">Device Name:</label>
            <input
              type="text"
              class="form-control"
              id="device-name"
              formControlName="Name"
              placeholder="Enter device name"
            />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">
            <i class="bx bx-x-circle"></i> Close
          </button>
          <button type="button" (click)="Create()" class="btn btn-success">
            <i class="bx bx-check"></i> Create
          </button>
        </div>
      </div>
    </div>
  </div>
</form>
